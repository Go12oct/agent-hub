name: Release

on:
  push:
    tags: ["v*"]

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require tag commit on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Ensure GitHub release exists
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
          else
            prerelease=()
            if [[ "$TAG" == *-* ]]; then
              prerelease+=(--prerelease)
            fi
            gh release create "$TAG" --title "Agent Hub $TAG" --generate-notes --draft "${prerelease[@]}"
          fi

  windows:
    needs: create-release
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:web
      - run: npm run build:daemon
      - name: Build Windows executable
        continue-on-error: true
        run: node daemon/scripts/build-sea.mjs
      - name: Check Windows signing configuration
        id: windows-signing
        shell: pwsh
        env:
          ES_USERNAME: ${{ secrets.ES_USERNAME }}
          ES_PASSWORD: ${{ secrets.ES_PASSWORD }}
          ES_CREDENTIAL_ID: ${{ secrets.ES_CREDENTIAL_ID }}
          ES_TOTP_SECRET: ${{ secrets.ES_TOTP_SECRET }}
        run: |
          if (-not (Test-Path 'daemon/dist/agent-hub.exe')) {
            Write-Output '::warning::Skipping Windows signing: agent-hub.exe is missing.'
            'enabled=false' >> $env:GITHUB_OUTPUT
          } elseif (-not $env:ES_USERNAME -or -not $env:ES_PASSWORD -or -not $env:ES_CREDENTIAL_ID -or -not $env:ES_TOTP_SECRET) {
            Write-Output '::warning::Skipping Windows signing: one or more eSigner repository secrets are missing.'
            'enabled=false' >> $env:GITHUB_OUTPUT
          } else {
            'enabled=true' >> $env:GITHUB_OUTPUT
          }
      - name: Sign Windows executable
        if: steps.windows-signing.outputs.enabled == 'true'
        uses: SSLcom/esigner-codesign@cf5f6c1d38ad10f47e3ed9aca873f429b1a8d85b # v1.3.2
        with:
          command: sign
          username: ${{ secrets.ES_USERNAME }}
          password: ${{ secrets.ES_PASSWORD }}
          credential_id: ${{ secrets.ES_CREDENTIAL_ID }}
          totp_secret: ${{ secrets.ES_TOTP_SECRET }}
          file_path: ${{ github.workspace }}/daemon/dist/agent-hub.exe
          override: true
          clean_logs: true
      - name: Verify Windows executable signature
        if: steps.windows-signing.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $signature = Get-AuthenticodeSignature -LiteralPath 'daemon/dist/agent-hub.exe'
          if ($signature.Status -ne 'Valid') {
            throw "Windows executable signature is not valid: $($signature.Status)"
          }
          if (-not $signature.TimeStamperCertificate) {
            throw 'Windows executable signature is missing a timestamp.'
          }
      - name: Assemble Windows package
        shell: pwsh
        run: ./scripts/build-windows-package.ps1
      - name: Upload Windows assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          $assets = @(
            'agent-hub-windows.zip',
            'daemon/dist/agent-hub.cjs',
            'daemon/dist/hook-bridge.cjs',
            'scripts/install.ps1'
          )
          if (Test-Path 'daemon/dist/agent-hub.exe') {
            $assets += 'daemon/dist/agent-hub.exe'
          }
          gh release upload "$env:TAG" @assets --clobber

  android:
    needs: create-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: npm ci
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - run: npm run build:web
      - run: npx cap sync android
      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [[ -z "$ANDROID_KEYSTORE_BASE64" ]]; then
            echo "::error::Repository secret ANDROID_KEYSTORE_BASE64 is required to publish a release APK."
            exit 1
          fi
          if [[ -z "$ANDROID_KEYSTORE_PASSWORD" ]]; then
            echo "::error::Repository secret ANDROID_KEYSTORE_PASSWORD is required to publish a release APK."
            exit 1
          fi
          keystore_path="$RUNNER_TEMP/agent-hub-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          AGENT_HUB_KEYSTORE="$keystore_path" \
          AGENT_HUB_KEYSTORE_PASSWORD="$ANDROID_KEYSTORE_PASSWORD" \
            ./gradlew assembleRelease
        working-directory: android
      - name: Upload Android APK
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk agent-hub-android.apk
          gh release upload "$TAG" agent-hub-android.apk --clobber

  publish:
    needs: [windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
