name: Release

on:
  push:
    tags: ["v*"]

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require tag commit on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Ensure GitHub release exists
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
          else
            prerelease=()
            if [[ "$TAG" == *-* ]]; then
              prerelease+=(--prerelease)
            fi
            gh release create "$TAG" --title "Agent Hub $TAG" --generate-notes --notes "Code signing policy: https://github.com/${{ github.repository }}/#code-signing-policy" --draft "${prerelease[@]}"
          fi

  windows:
    needs: create-release
    runs-on: windows-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:web
      - run: npm run build:daemon
        env:
          AGENT_HUB_DEFAULT_RELAY_URL: ${{ vars.AGENT_HUB_DEFAULT_RELAY_URL || 'https://92-5-42-80.sslip.io' }}
      - name: Build Windows executable
        continue-on-error: true
        run: node daemon/scripts/build-sea.mjs
      - name: Check Windows signing configuration
        id: windows-signing
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
        run: |
          if (-not (Test-Path 'daemon/dist/agent-hub.exe')) {
            Write-Output '::warning::Skipping Windows signing: agent-hub.exe is missing.'
            'enabled=false' >> $env:GITHUB_OUTPUT
          } elseif (-not $env:SIGNPATH_API_TOKEN -or -not $env:SIGNPATH_ORGANIZATION_ID -or -not $env:SIGNPATH_PROJECT_SLUG -or -not $env:SIGNPATH_SIGNING_POLICY_SLUG) {
            Write-Output '::warning::Skipping Windows signing: SignPath repository secret or variables are missing.'
            'enabled=false' >> $env:GITHUB_OUTPUT
          } else {
            'enabled=true' >> $env:GITHUB_OUTPUT
          }
      - name: Upload unsigned Windows executable
        id: unsigned-windows
        if: steps.windows-signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-windows-executable
          path: daemon/dist/agent-hub.exe
          if-no-files-found: error
      - name: Sign Windows executable
        if: steps.windows-signing.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@a2c5b60d9c75f073142b653c354b632eedce097b # v3.2
        timeout-minutes: 130
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.unsigned-windows.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 7200
          output-artifact-directory: ${{ runner.temp }}/signed-windows
      - name: Restore signed Windows executable
        if: steps.windows-signing.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $files = @(Get-ChildItem -LiteralPath "$env:RUNNER_TEMP/signed-windows" -Filter 'agent-hub.exe' -File -Recurse)
          if ($files.Count -ne 1) { throw "Expected one signed agent-hub.exe, found $($files.Count)" }
          Copy-Item -LiteralPath $files[0].FullName -Destination 'daemon/dist/agent-hub.exe' -Force
      - name: Verify Windows executable signature
        if: steps.windows-signing.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $signature = Get-AuthenticodeSignature -LiteralPath 'daemon/dist/agent-hub.exe'
          if ($signature.Status -ne 'Valid') {
            throw "Windows executable signature is not valid: $($signature.Status)"
          }
          if (-not $signature.TimeStamperCertificate) {
            throw 'Windows executable signature is missing a timestamp.'
          }
      - name: Assemble Windows package
        shell: pwsh
        run: ./scripts/build-windows-package.ps1
      - name: Upload Windows assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          $assets = @(
            'agent-hub-windows.zip',
            'daemon/dist/agent-hub.cjs',
            'daemon/dist/hook-bridge.cjs',
            'scripts/install.ps1'
          )
          if (Test-Path 'daemon/dist/agent-hub.exe') {
            $assets += 'daemon/dist/agent-hub.exe'
          }
          gh release upload "$env:TAG" @assets --clobber

  android:
    needs: create-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: npm ci
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - run: npm run build:web
      - run: npx cap sync android
      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [[ -z "$ANDROID_KEYSTORE_BASE64" ]]; then
            echo "::error::Repository secret ANDROID_KEYSTORE_BASE64 is required to publish a release APK."
            exit 1
          fi
          if [[ -z "$ANDROID_KEYSTORE_PASSWORD" ]]; then
            echo "::error::Repository secret ANDROID_KEYSTORE_PASSWORD is required to publish a release APK."
            exit 1
          fi
          keystore_path="$RUNNER_TEMP/agent-hub-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          AGENT_HUB_KEYSTORE="$keystore_path" \
          AGENT_HUB_KEYSTORE_PASSWORD="$ANDROID_KEYSTORE_PASSWORD" \
            ./gradlew assembleRelease
        working-directory: android
      - name: Upload Android APK
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk agent-hub-android.apk
          gh release upload "$TAG" agent-hub-android.apk --clobber

  publish:
    needs: [windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
