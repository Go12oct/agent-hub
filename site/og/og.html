<!doctype html><html><head><meta charset="utf-8"><style>
@import url('https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=Geist+Mono&display=swap');
body{margin:0;width:1200px;height:630px;background:#0b0d14;color:#eef0f5;font-family:Geist,system-ui;overflow:hidden;position:relative}
.dots{position:absolute;inset:0;background-image:radial-gradient(rgba(238,240,245,.13) 1.2px,transparent 1.4px);background-size:28px 28px;-webkit-mask-image:radial-gradient(ellipse at 70% 40%,#000 20%,transparent 75%)}

.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.b{height:48px;border-radius:12px;display:grid;place-items:center;font-weight:500;font-size:17px}
